<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎃 Witch's Cauldron — Seleção de Fases</title>
  
  <!-- Fontes de Fantasia Medieval e Pixel Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&family=VT323&display=swap" rel="stylesheet">
  
  <script type="module" crossorigin src="/assets/index-nx7o8Omf.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BF6cD2Ca.css">
</head>
<body>
  <!-- Container Principal do Jogo com Proporção 16:9 -->
  <main id="game-stage" class="game-stage">
    
    <!-- 1. CAMADA 0: Céu Noturno Dinâmico através da Janela -->
    <div id="window-backdrop" class="scene-layer layer-window">
      <canvas id="window-canvas" width="240" height="360"></canvas>
    </div>

    <!-- 2. CAMADA 1: Cenário da Cabana (com recorte transparente na janela) -->
    <div id="scene-background" class="scene-layer layer-bg">
      <img src="/assets/bg_room-BKym8Wnr.png" alt="Cenário da Cabana" class="bg-room-pixel-art" draggable="false" />
    </div>

    <!-- 3. CAMADA 2: Iluminação Dinâmica e Chamas Ambientais -->
    <div id="ambient-lighting" class="scene-layer layer-lighting">
      <!-- Chama da Lamparina da Mesa -->
      <div id="lantern-glow" class="light-emitter lantern-amber-light"></div>
      <div id="lantern-flame" class="flame-emitter lantern-pixel-flame"></div>

      <!-- Chamas das Velas na Parede Direita -->
      <div class="flame-emitter candle-flame candle-1"></div>
      <div class="flame-emitter candle-flame candle-2"></div>
      <div class="light-emitter candle-warm-light"></div>

      <!-- Brilho Místico do Orbe de Cristal -->
      <div class="light-emitter crystal-violet-aura"></div>
    </div>

    <!-- 4. CAMADA 3: Personagens (Bruxa e Gato Preto com Respiração e Piscadas) -->
    <div id="characters-group" class="scene-layer layer-characters">
      <!-- Bruxa -->
      <div id="witch-character" class="character-witch">
        <div id="witch-eyes-overlay" class="witch-eyes-sprite"></div>
      </div>

      <!-- Gato Preto -->
      <div id="cat-character" class="character-cat">
        <div id="cat-face-overlay" class="cat-face-sprite"></div>
      </div>
    </div>

    <!-- 5. CAMADA 4: Estante Central de Poções (Grade 3x3) -->
    <div id="shelf-mount" class="scene-layer layer-shelf"></div>

    <!-- 6. CAMADA 5: Informações do Jogador (Recorde e Botão Ranking) -->
    <div id="player-info-mount" class="scene-layer layer-player-info"></div>

    <!-- 7. CAMADA 6: Vegetação e Trepadeiras Independentes -->
    <div id="vegetation-group" class="scene-layer layer-vegetation">
      <div class="ivy-cluster ivy-top-left"></div>
      <div class="ivy-cluster ivy-top-center"></div>
      <div class="ivy-cluster ivy-shelf-left"></div>
      <div class="ivy-cluster ivy-shelf-right"></div>
      <div class="ivy-cluster ivy-window-top"></div>
    </div>

    <!-- 8. CAMADA 7: Placa do Título do Jogo -->
    <div id="logo-sign" class="scene-layer layer-logo">
      <div class="logo-sign-board">
        <span class="logo-potion-icon">⚗</span>
        <div class="logo-text-group">
          <span class="logo-text-main">Witch's</span>
          <span class="logo-text-sub">Cauldron</span>
        </div>
      </div>
    </div>

    <!-- 9. CAMADA 8: Canvas de Partículas Mágicas e Poeira de Fada -->
    <canvas id="particles-canvas" class="scene-layer layer-particles"></canvas>

    <!-- 10. CAMADA 9: Modais e Apresentações -->
    <div id="modals-root"></div>

    <!-- 11. CAMADA 10: Painel de Controles de Demonstração (Test HUD) -->
    <div id="demo-hud-root"></div>

  </main>

</body>
</html>
